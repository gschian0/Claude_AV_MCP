[project]
name = "av-mcp"
version = "0.1.0"
description = "Audio-visual MCP orchestration for Ableton, Max/MSP, Pure Data and visual tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.9.0,<2.0.0",
    "python-osc>=1.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
av-conductor = "av_mcp.server:main"
av-osc-monitor = "av_mcp.monitor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/av_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
